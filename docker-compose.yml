version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitbill-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splitbill}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-splitbill}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitbill-backend
    ports:
      - "${PORT:-4110}:4110"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-splitbill}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-fadil}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
